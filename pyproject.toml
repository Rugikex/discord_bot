[project]
name = "discord-bot"
version = "0.1.0"
description = "Discord music bot playing YouTube and local audio files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.7",
    "mutagen>=1.48",
    "python-dotenv>=1.2",
    "thefuzz>=0.22",
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# classes/ has no __init__.py
explicit_package_bases = true
exclude = ["^\\.venv/"]
warn_unused_ignores = true
warn_redundant_casts = true
# Every redefined method must be marked with @override (typo protection)
enable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
# Libraries without type hints
module = ["mutagen.*", "thefuzz.*", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
